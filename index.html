<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYURIA | 시술 갤러리</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#543f35;background:#f8f4ee}*{box-sizing:border-box}body{margin:0}header{text-align:center;padding:32px 16px;background:#eee3d8}h1{letter-spacing:4px;margin:0}header p{font-size:13px;color:#867164}.wrap{max-width:960px;margin:auto;padding:25px 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid #e4d6c9;border-radius:14px;overflow:hidden;background:white;padding:0;cursor:pointer;text-align:left;color:inherit}.cover{width:100%;height:200px;object-fit:cover;display:block;background:#eadbd0}.empty{height:200px;display:grid;place-items:center;background:#e9ddd3;color:#8a7465;font-size:13px}.content{padding:12px}.content strong{display:block}.content small{display:block;color:#88766b;margin-top:5px}.desc{color:#77665c;font-size:14px;line-height:1.7}.price{font-weight:700;margin-top:9px}.book{display:inline-block;background:#725341;color:white;border:0;border-radius:9px;padding:10px 14px;text-decoration:none;cursor:pointer}.dialog{border:0;border-radius:16px;max-width:700px;width:94vw;max-height:92vh;overflow:auto;padding:0;box-shadow:0 20px 90px #0005}.dialog::backdrop{background:#000a}.modalhead{padding:15px;display:flex;align-items:center;justify-content:space-between}.exit{border:0;background:none;font-size:27px;cursor:pointer}.modalbody{padding:0 16px 20px}.viewer{position:relative;background:#e8ded4}.viewer img{width:100%;max-height:52vh;object-fit:contain;display:block}.nav{position:absolute;top:45%;background:#fffe;border:0;border-radius:50%;font-size:25px;padding:5px 12px;cursor:pointer}.prev{left:8px}.next{right:8px}.count{text-align:center;font-size:12px;color:#777;margin:8px}.mini{display:flex;gap:8px;overflow-x:auto;margin:12px 0}.mini img{width:62px;height:62px;object-fit:cover;border-radius:7px;cursor:pointer}.bookingActions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.book:focus-visible{outline:3px solid #262626;outline-offset:3px}.notice{padding:12px;border-radius:10px;background:#f1e9e1;font-size:13px;color:#765e50;margin-bottom:18px}footer{text-align:center;padding:22px;color:#a18c80;font-size:12px}@media(min-width:780px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:480px){.cover,.empty{height:155px}}
</style></head><body><header><h1>MYURIA</h1><p>LASH DESIGN COLLECTION</p></header><main class="wrap"><div class="notice">시술 디자인을 눌러 실제 사진과 설명을 확인하세요.</div><div id="grid" class="grid"></div><div class="bookingActions"><a class="book" id="mainBooking" target="_blank" rel="noopener noreferrer">네이버 예약 전체 보기 ↗</a></div></main><dialog class="dialog" id="dlg"><div class="modalhead"><strong id="title"></strong><button class="exit" id="exit" aria-label="닫기">×</button></div><div class="modalbody"><div class="viewer" id="viewer"></div><div class="count" id="count"></div><div class="mini" id="mini"></div><p class="price" id="price"></p><p class="desc" id="desc"></p><div class="bookingActions"><a class="book" id="categoryBooking" target="_blank" rel="noopener noreferrer">네이버 예약하기 ↗</a></div><p class="desc" style="font-size:12px">네이버 예약 화면에서 해당 시술 메뉴를 선택해 주세요.</p></div></dialog><footer>MYURIA · Personal Blog Test Gallery</footer><script>
const BOOKING_URL='https://map.naver.com/p/entry/place/2020949883?placePath=%2Fticket%3Fentry%3Dplt%26from%3Dmap%26fromPanelNum%3D1%26additionalHeight%3D76%26timestamp%3D202611021142%26locale%3Dko%26svcName%3Dmap_pcv5&searchType=place&lng=127.1292830&lat=37.4102801&c=15.00,0,0,0,dh';document.querySelector('#mainBooking').href=BOOKING_URL;const grid=document.querySelector('#grid'),dlg=document.querySelector('#dlg');let current,position=0;const html=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function openCat(c){current=c;position=0;drawDetail();dlg.showModal()}function drawDetail(){const booking=document.querySelector('#categoryBooking');booking.href=BOOKING_URL;booking.textContent=(current.id==='classic'||current.id==='mascara'?'연장 예약하기 ↗':'펌 예약하기 ↗');document.querySelector('#title').textContent=current.name;document.querySelector('#price').textContent=current.price?'가격: '+current.price:'가격 문의';document.querySelector('#desc').textContent=current.description||'시술 설명 준비 중';let photos=current.photos||[];const viewer=document.querySelector('#viewer');viewer.replaceChildren();if(photos.length){let img=document.createElement('img');img.src=photos[position];img.alt=current.name;viewer.append(img);if(photos.length>1){for(const [label,step,cls] of [['‹',-1,'prev'],['›',1,'next']]){let b=document.createElement('button');b.textContent=label;b.className='nav '+cls;b.onclick=()=>{position=(position+step+photos.length)%photos.length;drawDetail()};viewer.append(b)}}}else viewer.innerHTML='<div class="empty">등록된 사진이 없습니다</div>';document.querySelector('#count').textContent=photos.length?`${position+1} / ${photos.length}`:'';let mini=document.querySelector('#mini');mini.replaceChildren();photos.forEach((p,i)=>{let el=document.createElement('img');el.src=p;el.alt=`${current.name} ${i+1}`;el.onclick=()=>{position=i;drawDetail()};mini.append(el)})}document.querySelector('#exit').onclick=()=>dlg.close();dlg.onclick=e=>{if(e.target===dlg)dlg.close()};fetch('./album.json').then(r=>{if(!r.ok)throw Error('album.json not found');return r.json()}).then(data=>{for(const c of data.categories){let el=document.createElement('button');el.className='card';let photos=c.photos||[];el.innerHTML=(photos.length?`<img class="cover" src="${html(photos[0])}" alt="${html(c.name)}">`:'<div class="empty">사진을 추가해 주세요</div>')+`<div class="content"><strong>${html(c.name)}</strong><small>${photos.length}장 · ${html(c.price||'가격 문의')}</small></div>`;el.onclick=()=>openCat(c);grid.append(el)}}).catch(e=>{grid.textContent='앨범 정보를 불러오지 못했습니다. Cloudflare에 index.html, album.json 및 사진을 함께 업로드했는지 확인하세요.';console.error(e)});
</script></body></html>
